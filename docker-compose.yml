# Production stack: the MCP server is reachable only through Caddy, which terminates HTTPS
# with an automatically issued Let's Encrypt certificate for $DOMAIN.
services:
  app:
    build: .
    image: google-tasks-mcp:latest
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_PATH: /data/gtasks-mcp.sqlite
      TRUST_PROXY_HOPS: "1"
    volumes:
      - app-data:/data
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    # No published ports: only Caddy can reach the app.
    expose:
      - "8080"
    networks: [internal]

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on: [app]
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN in .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    networks: [internal]

volumes:
  app-data:
  caddy-data:
  caddy-config:

networks:
  internal:
